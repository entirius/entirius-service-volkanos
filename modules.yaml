# Registry of the modules and libraries this service depends on. The order of `modules` is the order of LOCAL_APPS:
# every module comes after the modules it requires. tests/test_modules_registry.py keeps this file true against
# pyproject.toml, main/urls.py and the installed package metadata; main/settings_example.py is generated from it
# (make settings-example).
#
# requires     modules that must be enabled with it (hard package dependencies)
# optional     modules it works with when they are enabled (package extras)
# also_enable  apps it imports whenever their package is installed: on this service they must be enabled with it
# queues       worker queues its tasks are routed to (celery is the default queue)
# settings     Django settings it reads
# urls         main/urls.py routes it when its app is enabled

domains:
  - {id: foundation, title: Foundation}
  - {id: catalog, title: Catalog}
  - {id: pricing-stock, title: Pricing and Stock}
  - {id: orders, title: Orders and Payments}
  - {id: content, title: Content}
  - {id: customers, title: Customers}
  - {id: suppliers, title: Suppliers and Market Intelligence}
  - {id: leads, title: Leads and Outreach}
  - {id: integrations, title: Integrations}

