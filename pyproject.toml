# dev-integration only: modules with unreleased work come from their `develop` at a fixed commit, so a server can
# deploy service develop + module develops reproducibly. Never merge this block into develop or master: releases and
# client forks resolve from PyPI. Refresh: new SHAs here, `uv lock`.
# communicator, notifications and todo follow `branch = "develop"` because leads names them that way in its own
# sources (two URLs for one package do not resolve); uv.lock still records the exact commit of each.
[tool.uv.sources]
entirius-django-leads = { git = "https://github.com/entirius/entirius-django-leads", rev = "4c016881bdfeb2ae83dba808c5b7d6be6818195f" }
entirius-django-communicator = { git = "https://github.com/entirius/entirius-django-communicator", branch = "develop" }
entirius-django-notifications = { git = "https://github.com/entirius/entirius-django-notifications", branch = "develop" }
entirius-django-todo = { git = "https://github.com/entirius/entirius-django-todo", branch = "develop" }
entirius-django-stock-alerts = { git = "https://github.com/entirius/entirius-django-stock-alerts", rev = "97e92447c17e95d37bcb09c5a342de34c4f23fc4" }
entirius-django-email = { git = "https://github.com/entirius/entirius-django-email", rev = "b351cb11eae7cc4be70fae8685962b8db73df8b9" }
entirius-django-checkout = { git = "https://github.com/entirius/entirius-django-checkout", rev = "bc072533f861d484b62f8043d73326395a719813" }
entirius-django-pricemanager = { git = "https://github.com/entirius/entirius-django-pricemanager", rev = "763e20394ee9efb1c536b3a76ec2da45d2551aa5" }
entirius-django-access = { git = "https://github.com/entirius/entirius-django-access", rev = "6e1ba17daf3a3c8aa9c00e4cd6f514046053544d" }
entirius-django-matrix = { git = "https://github.com/entirius/entirius-django-matrix", rev = "72605dcebea8c7c0806d26939d44c31d48b45640" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entirius-service-volkanos"
version = "4.3.0"
description = "Backend service of Entirius: a thin Django shell that runs the platform's modules behind one REST API"
keywords = ["django", "ecommerce", "entirius", "rest-api", "headless", "backend"]
authors = [
    { name = "Piotr Brzozowski", email = "piotrb@entirius.com" },
]
maintainers = [
    { name = "Piotr Brzozowski" },
    { name = "Paweł Kiełt" },
    { name = "Mateusz Baran" },
    { name = "Michał Kloczkowski" },
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    # browser frontends (storefront/CMS) call the API cross-origin; origins per environment
    "django-cors-headers>=4.4",
    # django-redis: CACHES backend contract of django_matrix signal batching (caches["default"].client)
    "django-redis>=5.4",
    "django>=5.2",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "python-decouple>=3.8",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-graylog-json-formatter>=2.0.0",
    "entirius-py-int-enum-choices>=2.0.0",
    "entirius-py-lockfile>=2.0.0",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
    "entirius-py-image-transformations>=2.0.0",
    "entirius-py-pdf-generator>=2.0.0",
    "entirius-py-payu-sdk>=2.0.0",
    "entirius-py-paypal-sdk>=2.0.0",
    "entirius-py-autopay-sdk>=2.0.0",
    "entirius-py-przelewy24-sdk>=2.0.0",
    "entirius-py-paynow-sdk>=2.0.0",
    "entirius-py-magento2-sdk>=2.0.0",
    "entirius-py-synerise-sdk>=2.0.0",
    "entirius-py-salesmanago-sdk>=2.1.0",
    "entirius-py-edrone-sdk>=2.0.0",
    "entirius-py-get-response-sdk>=3.0.0",
    "entirius-py-magento2-sdk2>=2.1.0",
    "entirius-django-access>=1.1.0",
    "entirius-django-regional>=2.1.0",
    "entirius-django-utils>=2.4.3",
    "entirius-django-pim>=3.6.1",
    "entirius-django-utils-translator>=2.2.0",
    "entirius-django-pricemanager>=4.3.0",
    "entirius-django-pim-csv>=4.1.0",
    "entirius-django-pim-translator>=2.1.1",
