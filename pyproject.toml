[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://docs.entirius.com/"
Repository = "https://github.com/entirius/entirius-service-volkanos"
Changelog = "https://github.com/entirius/entirius-service-volkanos/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-service-volkanos/issues"

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "respx>=0.21",
    "pytest-cov>=6.2",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "main"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["apps", "main"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"main/settings*.py" = ["F403", "F405", "S105"]
"*/migrations/*.py" = ["E501"]
"tests/**" = ["S101"]
"**/tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "main"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "main.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["apps", "tests"]

[tool.coverage.run]
source = ["apps", "main"]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "main/wsgi.py", "main/asgi.py"]
